<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NUMA STUDIO | Arquitectura</title>


    <!-- =========================================
         TIPOGRAFÍAS
    ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700;6..96,800;6..96,900&family=Inter:wght@300;400&display=swap" rel="stylesheet">


    <style>


        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }


        body {
            font-family: 'Inter', sans-serif;
        }



        /* =========================================
           PORTADA
        ========================================== */

        .hero {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }



        /* =========================================
           IMAGEN PRINCIPAL
        ========================================== */

        .hero-image {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center center;

            z-index: 1;

            animation: entradaImagen 1.8s ease-out forwards;
        }



        /* =========================================
           NUMASTUDIO
        ========================================== */

        .hero-title {

            position: absolute;

            left: 50%;

            top: 36%;

            transform: translate(-50%, -50%);

            width: 100%;

            text-align: center;


            /* TIPOGRAFÍA DEL NOMBRE */

            font-family: 'Bodoni Moda', serif;

            font-size: clamp(95px, 15vw, 260px);

            font-weight: 800;

            font-style: normal;

            letter-spacing: -0.065em;

            line-height: 0.78;

            white-space: nowrap;


            /* COLOR */

            color: rgba(255, 255, 255, 0.94);


            /* IMPORTANTE:
               queda detrás del edificio */

            z-index: 2;

            pointer-events: none;


            animation: aparecerNombre 1.8s ease-out forwards;
        }



        /* =========================================
           EDIFICIO DELANTE
        ========================================== */

        .building-front {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center center;

            z-index: 3;

            pointer-events: none;


            /*
               SILUETA DEL EDIFICIO
            */

            clip-path: polygon(

                27% 43%,
                30% 39%,
                36% 35%,
                45% 31%,
                56% 30%,
                67% 32%,
                76% 37%,
                82% 42%,
                84% 51%,
                84% 62%,
                82% 67%,
                78% 69%,
                72% 69%,
                66% 68%,
                61% 69%,
                55% 68%,
                49% 69%,
                43% 68%,
                37% 67%,
                32% 65%,
                29% 61%,
                27% 55%
            );
        }



        /* =========================================
           BARRA SUPERIOR
        ========================================== */

        .top-bar {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;

            padding: 32px 42px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            z-index: 10;

            color: white;
        }



        /* =========================================
           MARCA
        ========================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 17px;

            font-size: 11px;

            font-weight: 300;

            letter-spacing: 0.28em;

            color: white;
        }


        .brand-line {

            width: 38px;

            height: 1px;

            background: white;

            opacity: 0.9;
        }



        /* =========================================
           MENÚ
        ========================================== */

        .menu {

            width: 35px;

            height: 24px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            gap: 7px;

            cursor: pointer;
        }


        .menu span {

            display: block;

            width: 100%;

            height: 1px;

            background: white;
        }



        /* =========================================
           TEXTO INFERIOR IZQUIERDO
        ========================================== */

        .bottom-left {

            position: absolute;

            left: 42px;

            bottom: 36px;

            z-index: 10;

            color: white;

            font-size: 10px;

            font-weight: 300;

            letter-spacing: 0.22em;
        }


        .bottom-left span {

            margin: 0 8px;

            opacity: 0.65;
        }



        /* =========================================
           TEXTO INFERIOR DERECHO
        ========================================== */

        .bottom-right {

            position: absolute;

            right: 42px;

            bottom: 36px;

            z-index: 10;

            color: white;

            font-size: 10px;

            font-weight: 300;

            letter-spacing: 0.24em;
        }



        /* =========================================
           SCROLL
        ========================================== */

        .scroll {

            position: absolute;

            right: 42px;

            bottom: 76px;

            width: 19px;

            height: 32px;

            border: 1px solid rgba(255,255,255,0.85);

            border-radius: 20px;

            z-index: 10;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding-top: 6px;
        }


        .scroll::before {

            content: "";

            width: 2px;

            height: 6px;

            border-radius: 10px;

            background: white;

            animation: scrollMovimiento 1.6s infinite;
        }



        /* =========================================
           ANIMACIÓN IMAGEN
        ========================================== */

        @keyframes entradaImagen {

            from {

                opacity: 0;

                transform: scale(1.04);
            }

            to {

                opacity: 1;

                transform: scale(1);
            }
        }



        /* =========================================
           ANIMACIÓN NUMASTUDIO
        ========================================== */

        @keyframes aparecerNombre {

            from {

                opacity: 0;

                transform:
                    translate(-50%, -47%);
            }

            to {

                opacity: 1;

                transform:
                    translate(-50%, -50%);
            }
        }



        /* =========================================
           ANIMACIÓN SCROLL
        ========================================== */

        @keyframes scrollMovimiento {

            0% {

                transform: translateY(0);

                opacity: 0;
            }

            30% {

                opacity: 1;
            }

            100% {

                transform: translateY(12px);

                opacity: 0;
            }
        }



        /* =========================================
           VERSIÓN MÓVIL
        ========================================== */

        @media (max-width: 768px) {


            .top-bar {

                padding: 24px 22px;
            }


            .brand {

                font-size: 9px;

                letter-spacing: 0.22em;
            }


            .brand-line {

                width: 25px;
            }


            .hero-title {

                font-size: 20vw;

                top: 35%;
            }


            .bottom-left {

                left: 22px;

                bottom: 24px;

                font-size: 7px;

                letter-spacing: 0.14em;
            }


            .bottom-right {

                right: 22px;

                bottom: 24px;

                font-size: 7px;

                letter-spacing: 0.16em;
            }


            .scroll {

                right: 22px;

                bottom: 67px;
            }

        }


    </style>

</head>


<body>


    <!-- =========================================
         INICIO / PORTADA
    ========================================== -->

    <main class="hero">


        <!-- IMAGEN ORIGINAL -->

        <img
            src="./images/ocean-front-5.jpg"
            alt="Ocean Front"
            class="hero-image"
        >


        <!-- =====================================
             NUMASTUDIO DETRÁS
        ====================================== -->

        <div class="hero-title">
            NUMASTUDIO
        </div>


        <!-- =====================================
             IMAGEN DEL EDIFICIO DELANTE
        ====================================== -->

        <img
            src="./images/ocean-front-5.jpg"
            alt=""
            class="building-front"
        >


        <!-- =====================================
             BARRA SUPERIOR
        ====================================== -->

        <header class="top-bar">


            <div class="brand">

                <div class="brand-line"></div>

                <span>NUMA STUDIO</span>

            </div>


            <div class="menu">

                <span></span>

                <span></span>

                <span></span>

            </div>


        </header>



        <!-- =====================================
             INFORMACIÓN INFERIOR
        ====================================== -->

        <div class="bottom-left">

            ARQUITECTURA

            <span>/</span>

            DISEÑO

            <span>/</span>

            EXPERIENCIAS

        </div>



        <div class="bottom-right">

            NUMA STUDIO

        </div>



        <!-- =====================================
             INDICADOR
        ====================================== -->

        <div class="scroll"></div>


    </main>


</body>

</html>
