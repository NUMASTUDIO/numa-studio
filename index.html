
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMA STUDIO</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.portada {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
}

.fondo,
.frente {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.fondo {
  z-index: 1;
}

.titulo {
  position: absolute;
  z-index: 2;
  top: 37%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: 96%;
  color: #eee5d3;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2.5rem, 12vw, 13rem);
  font-weight: 400;
  letter-spacing: 0.015em;
  white-space: nowrap;
  line-height: 1;
}

.frente {
  z-index: 3;
  -webkit-mask-image: url("./images/mascara-portada.png");
  mask-image: url("./images/mascara-portada.png");
  -webkit-mask-size: 100% 100%;
  mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
}

</style>
</head>

<body>
<main class="portada">
  <img
    class="fondo"
    src="./images/portada-html.jpg"
    alt="Portada de NUMA STUDIO"
  >

  <h1 class="titulo">NUMASTUDIO</h1>

  <img
    class="frente"
    src="./images/portada-html.jpg"
    alt=""
    aria-hidden="true"
  >
</main>
</body>
</html>
