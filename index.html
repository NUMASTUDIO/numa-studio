      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

  .logo {
  position: absolute;
  z-index: 2;
  top: 27%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(76%, 900px);
  height: auto;
  object-fit: contain;
  display: block;
  opacity: 1;
  visibility: visible;
}
    .frente {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

      .logo {
