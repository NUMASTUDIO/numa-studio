<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Numa Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0d1a22;
  color:white;
  font-family:'Inter', sans-serif;
}

/* NAV */
header{
  position:absolute;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:30px 60px;
  z-index:10;
}

.logo{
  font-family:'Playfair Display';
  letter-spacing:2px;
}

nav a{
  margin-left:30px;
  text-decoration:none;
  color:white;
  font-size:14px;
  opacity:.8;
}

nav a:hover{
  opacity:1;
}

/* HERO */
.hero{
  height:100vh;
  background:url('images/amouna.jpg.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  padding:0 60px;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.hero-content{
  position:relative;
  max-width:600px;
  z-index:2;
}

.hero h1{
  font-family:'Playfair Display';
  font-size:48px;
  line-height:1.2;
  margin-bottom:20px;
}

.hero p{
  color:#ccc;
  font-size:14px;
}

/* PROYECTOS */
.projects{
  padding:100px 60px;
}

.projects h2{
  font-family:'Playfair Display';
  font-size:22px;
  margin-bottom:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.project{
  height:300px;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:end;
  padding:20px;
  font-family:'Playfair Display';
  font-size:16px;
  letter-spacing:1px;
  background-color:rgba(0,0,0,0.3);
  background-blend-mode:darken;
}

</style>

</head>

<body>

<header>
  <div class="logo">NUMA STUDIO</div>

  <nav>
    <a href="#">INICIO</a>
    <a href="#">SERVICIOS</a>
    <a href="#">PROYECTOS</a>
    <a href="#">CONTACTO</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>ARQUITECTURA NACIDA DE LA VISIÓN, CONSTRUIDA CON PROPÓSITO.</h1>
    <p>Diseñamos espacios que combinan estética, funcionalidad y esencia.</p>
  </div>
</section>

<section class="projects">
  <h2>PROYECTOS</h2>

  <div class="grid">

    <div class="project" style="background-image:url('images/casa-natura.jpg.png')">
      CASA NATURA
    </div>

    <div class="project" style="background-image:url('images/la-martina.jpg.png')">
      LA MARTINA
    </div>

    <div class="project" style="background-image:url('images/amouna.jpg.jpg')">
      AMOUNA
    </div>

    <div class="project" style="background-image:url('images/mcdonalds.jpg.png')">
      MCDONALD'S
    </div>

  </div>
</section>

</body>
</html>
