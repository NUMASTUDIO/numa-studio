
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUMA STUDIO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
    }

    .portada {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .portada img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>

<body>
  <main class="portada">
    <img
      src="./images/portada-html.jpg"
      alt="Portada de NUMA STUDIO"
    >
  </main>
</body>
</html>
