```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUMA STUDIO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .portada {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }

    .fondo,
    .frente {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* 1. Fotografía de fondo */
    .fondo {
      z-index: 1;
    }

    /* 2. Logotipo detrás del edificio y las palmeras */
    .logo {
      position: absolute;
      z-index: 2;
      top: 34%;
      left: 50%;
      display: block;
      width: min(82%, 1000px);
      height: auto;
      max-height: 70%;
      object-fit: contain;
      object-position: center;
      transform: translate(-50%, -50%);
    }

    /* 3. Fotografía en primer plano recortada por la máscara */
   ```css
.frente {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: 3;

  -webkit-mask-image: url("./images/mascara-portada.png");
  mask-image: url("./images/mascara-portada.png");

  /* Mantener la proporción y el encuadre de la fotografía */
  -webkit-mask-size: cover;
  mask-size: cover;

  -webkit-mask-position: center;
  mask-position: center;

  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;

  -webkit-mask-mode: alpha;
  mask-mode: alpha;
}
```

</head>

    >

  </main>
</body>
</html>
