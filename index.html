<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NUMA STUDIO | Architecture & Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: "Montserrat", sans-serif;
      background: #063750;
    }

    body {
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      isolation: isolate;
      background: #063750;
      color: #f8f0df;
    }

    /* Imagen principal */
    .hero-image,
    .building-front {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .hero-image {
      z-index: 0;
    }

    /* Letras detrás del edificio */
    .main-title {
      position: absolute;
      top: 26.5%;
      left: 50%;
      z-index: 1;
      width: 100%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(70px, 12.2vw, 205px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.065em;
      color: #f7efdf;
      pointer-events: none;
    }

    /* Segunda capa: oculta las letras donde está el edificio */
    .building-front {
      z-index: 2;
      clip-path: polygon(
        23% 42%,
        25% 39.5%,
        30% 38.5%,
        36% 37.5%,
        43% 37%,
        50% 37.5%,
        57% 38%,
        64% 38.5%,
        69% 40%,
        72% 43%,
        72% 53%,
        70% 59%,
        69% 65%,
        68% 72%,
        66% 75%,
        29% 75%,
        27% 71%,
        26% 64%,
        24% 57%,
        23% 50%
      );
      pointer-events: none;
    }

    /* Logotipo superior izquierdo */
    .brand {
      position: absolute;
      top: 25px;
      left: 2.6%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 2px;
      color: #f7f0e5;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-n {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(32px, 3vw, 47px);
      font-weight: 500;
      line-height: 0.9;
      color: #e8b36c;
    }

    .brand-numa {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(23px, 2.1vw, 34px);
      font-weight: 500;
      letter-spacing: 0.015em;
    }

    .brand-studio {
      margin-left: 8px;
      font-size: clamp(9px, 1vw, 15px);
      font-weight: 200;
      letter-spacing: 0.28em;
    }

    /* Menú hamburguesa */
    .menu-button {
      position: absolute;
      top: 29px;
      right: 3.4%;
      z-index: 10;
      width: 42px;
      height: 36px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-button span {
      position: absolute;
      left: 2px;
      width: 36px;
      height: 1.5px;
      background: #f7f3eb;
    }

    .menu-button span:nth-child(1) { top: 8px; }
    .menu-button span:nth-child(2) { top: 18px; }
    .menu-button span:nth-child(3) { top: 28px; }

    .menu-button.active span:nth-child(1) {
      top: 18px;
      transform: rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      display: none;
    }

    .menu-button.active span:nth-child(3) {
      top: 18px;
      transform: rotate(-45deg);
    }

    /* Menú desplegable */
    .menu-panel {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 8;
      display: flex;
      width: min(360px, 85vw);
      height: 100%;
      padding: 100px 42px 40px;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      background: rgba(3, 35, 53, 0.97);
      transform: translateX(101%);
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-panel a {
      color: #f7efdf;
      text-decoration: none;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 29px;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .menu-panel a:hover {
      color: #e8b36c;
    }

    /* Redes sociales */
    .socials {
      position: absolute;
      right: 2.05%;
      bottom: 12%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .social-link {
      display: flex;
      width: 50px;
      height: 50px;
      align-items: center;
      justify-content: center;
      color: #fffaf1;
      border: 2px solid rgba(255, 250, 241, 0.95);
      border-radius: 50%;
      text-decoration: none;
    }

    .social-link svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-link.facebook svg {
      fill: currentColor;
      stroke: none;
    }

    /* Indicador inferior */
    .scroll-indicator {
      position: absolute;
      right: 2.85%;
      bottom: 3.7%;
      z-index: 5;
      display: flex;
      width: 29px;
      height: 49px;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      border: 1.5px solid #fffaf1;
      border-radius: 18px;
      color: #fffaf1;
      text-decoration: none;
    }

    .scroll-indicator span {
      font-size: 13px;
      line-height: 10px;
    }

    @media (max-width: 700px) {
      .hero {
        min-height: 560px;
      }

      .hero-image,
      .building-front {
        object-position: 48% center;
      }

      .brand {
        top: 22px;
        left: 4%;
      }

      .brand-studio {
        margin-left: 5px;
        letter-spacing: 0.16em;
      }

      .menu-button {
        top: 22px;
        right: 4%;
      }

      .main-title {
        top: 34%;
        font-size: clamp(55px, 12.5vw, 90px);
        letter-spacing: -0.07em;
      }

      .socials {
        right: 3%;
        bottom: 13%;
        gap: 8px;
      }

      .social-link {
        width: 38px;
        height: 38px;
        border-width: 1.5px;
      }

      .social-link svg {
        width: 22px;
        height: 22px;
      }

      .scroll-indicator {
        right: 4%;
        bottom: 3%;
        width: 25px;
        height: 42px;
      }
    }

    @media (max-width: 390px) {
      .brand-studio {
        display: none;
      }

      .main-title {
        font-size: 12vw;
      }
    }
  </style>
</head>

<body>
  <main class="hero" id="inicio">

    <!-- Imagen de portada -->
    <img
      class="hero-image"
      src="./images/portada-html.jpg"
      alt="Portada arquitectónica de NUMA STUDIO"
      fetchpriority="high"
    >

    <!-- Logotipo -->
    <a class="brand" href="#inicio" aria-label="NUMA STUDIO, inicio">
      <span class="brand-n">N</span>
      <span class="brand-numa">UMA</span>
      <span class="brand-studio">STUDIO</span>
    </a>

    <!-- Título detrás del edificio -->
    <h1 class="main-title">NUMASTUDIO</h1>

    <!-- Capa que permite ocultar las letras con el edificio -->
    <img
      class="building-front"
      src="./images/portada-html.jpg"
      alt=""
      aria-hidden="true"
    >

    <!-- Botón de menú -->
    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="Abrir menú"
      aria-expanded="false"
      aria-controls="menuPanel"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navegación -->
    <nav class="menu-panel" id="menuPanel" aria-label="Menú principal">
      <a href="./index.html">Inicio</a>
      <a href="./sobre-nosotros.html">Sobre nosotros</a>
      <a href="./proyectos.html">Proyectos</a>
      <a href="mailto:contacto@numastudio.com">Contacto</a>
    </nav>

    <!-- Redes sociales -->
    <nav class="socials" aria-label="Redes sociales">

      <a class="social-link"
         href="mailto:contacto@numastudio.com"
         aria-label="Correo electrónico">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/>
          <path d="m3.5 6 8.5 7 8.5-7"/>
        </svg>
      </a>

      <a class="social-link"
         href="https://wa.me/"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.3 11.7a8.3 8.3 0 0 1-12.2 7.4L3 20.5l1.4-4.9a8.3 8.3 0 1 1 15.9-3.9Z"/>
          <path d="M8.4 7.8c.2-.5.5-.5.8-.5h.4c.2 0 .4.1.5.5l.7 1.7c.1.3.1.5-.1.7l-.6.7c-.2.2-.2.4 0 .7.7 1.2 1.6 2.1 2.9 2.7.3.1.5.1.7-.1l.8-.9c.2-.2.4-.3.7-.2l1.6.8c.3.1.4.3.4.5 0 .4-.2 1.2-.7 1.6-.5.5-1.3.8-2.1.7-1-.1-2.4-.6-4.1-2.1-1.4-1.2-2.4-2.7-2.7-3.8-.3-1 .1-2 .5-2.5Z"/>
        </svg>
      </a>

      <a class="social-link"
         href="https://www.instagram.com/numastudioarq/"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.6" cy="6.7" r=".8"
                  fill="currentColor" stroke="none"/>
        </svg>
      </a>

      <a class="social-link facebook"
         href="https://www.facebook.com/numastudioarq/"
         target="_blank"

         aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.8 21v-8h2.7l.4-3.2h-3.1v-2c0-.9.3-1.5 1.6-1.5H17V3.4c-.7-.1-1.5-.2-2.5-.2-2.5 0-4.2 1.5-4.2 4.3v2.3H7.5V13h2.8v8h3.5Z"/>
        </svg>
      </a>

    </nav>

    <!-- Indicador para desplazarse -->
    <a
      class="scroll-indicator"
      href="#contenido"
      aria-label="Desplazarse hacia abajo"
    >
      <span>⌄</span>
    </a>

  </main>

  <div id="contenido"></div>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");

    menuButton.addEventListener("click", () => {
      const isOpen = menuPanel.classList.toggle("open");

      menuButton.classList.toggle("active", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "Cerrar menú" : "Abrir menú"
      );
    });

    menuPanel.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        menuPanel.classList.remove("open");
        menuButton.classList.remove("active");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Abrir menú");
      });
    });
  </script>
</body>
