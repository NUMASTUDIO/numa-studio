
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071522">

  <title>NUMA STUDIO | Architecture & Design</title>
  <meta name="description"
        content="NUMA STUDIO — Architecture, design and visualization.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #071522;
      font-family: Georgia, "Times New Roman", serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      background: #071522;
    }

    /* Imagen de portada */
    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Botón transparente sobre el menú de la imagen */
    .menu-trigger {
      position: absolute;
      z-index: 5;
      top: 2%;
      right: 3%;
      width: 5%;
      height: 8%;
      min-width: 48px;
      min-height: 42px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-trigger:focus-visible,
    .social-link:focus-visible,
    .scroll-link:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    /* Panel de navegación */
    .menu-panel {
      position: absolute;
      z-index: 10;
      inset: 0 0 0 auto;
      width: min(390px, 85%);
      padding: 100px 42px 40px;
      background: rgba(5, 15, 26, 0.97);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 30px;
      transform: translateX(105%);
      visibility: hidden;
      transition: transform .4s ease,
                  visibility .4s ease;
    }

    .menu-panel.open {
      transform: translateX(0);
      visibility: visible;
    }

    .menu-close {
      position: absolute;
      top: 25px;
      right: 30px;
      color: white;
      font-size: 32px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .menu-panel a {
      color: #f4e9d8;
      text-decoration: none;
      font-size: 20px;
      letter-spacing: 3px;
      transition: color .25s ease;
    }

    .menu-panel a:hover {
      color: #d6ad70;
    }

    .menu-label {
      color: #c9a56f;
      font: 11px Arial, sans-serif;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    /* Enlaces laterales.
       La portada ya contiene los iconos visuales.
       Estas áreas transparentes los hacen clicables. */
    .social-link {
      position: absolute;
      z-index: 4;
      right: 1.8%;
      width: 3.3%;
      min-width: 38px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: block;
      background: transparent;
    }

    .social-email { top: 65.7%; }
    .social-whatsapp { top: 72.4%; }
    .social-instagram { top: 79.1%; }
    .social-facebook { top: 85.8%; }

    /* Indicador inferior */
    .scroll-link {
      position: absolute;
      z-index: 4;
      right: 2.7%;
      bottom: 0.5%;
      width: 3%;
      min-width: 35px;
      height: 6%;
      min-height: 42px;
      display: block;
      border-radius: 25px;
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 440px;
      }

      .hero-image {
        object-position: center;
      }

      .menu-trigger {
        right: 3%;
        width: 10%;
      }

      .social-link {
        right: 2%;
        width: 8%;
      }

      .social-email { top: 65.7%; }
      .social-whatsapp { top: 72.4%; }
      .social-instagram { top: 79.1%; }
      .social-facebook { top: 85.8%; }

      .scroll-link {
        right: 2%;
        width: 7%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" aria-label="Portada NUMA STUDIO">

      <!-- Guarda portada-de-pagina.jpg junto a este archivo -->
      <img
        class="hero-image"
        src="portada-de-pagina.jpg"
        alt="Pabellón arquitectónico frente al mar al atardecer"
      >

      <button
        class="menu-trigger"
        id="menuTrigger"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="mainMenu">
      </button>

      <nav class="menu-panel" id="mainMenu" aria-label="Menú principal">
        <button class="menu-close" id="menuClose"
                aria-label="Cerrar menú">×</button>

        <p class="menu-label">NUMA STUDIO</p>

        <a href="#inicio">Inicio</a>
        <a href="sobre-nosotros.html">Sobre nosotros</a>
        <a href="#proyectos">Proyectos</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
      </nav>

      <!-- Sustituye los enlaces de ejemplo por tus perfiles reales -->
      <a class="social-link social-email"
         href="mailto:contacto@tudominio.com"
         aria-label="Correo electrónico"></a>

      <a class="social-link social-whatsapp"
         href="https://wa.me/TUNUMERO"
         target="_blank" rel="noopener noreferrer"
         aria-label="WhatsApp"></a>

      <a class="social-link social-instagram"
         href="https://www.instagram.com/numastudioarq/"
         target="_blank" rel="noopener noreferrer"
         aria-label="Instagram"></a>

      <a class="social-link social-facebook"
         href="https://www.facebook.com/"
         target="_blank" rel="noopener noreferrer"
         aria-label="Facebook"></a>

      <a class="scroll-link" href="#proyectos"
         aria-label="Explorar proyectos"></a>

    </section>

    <!-- Secciones de destino: integra aquí las de tu web actual -->
    <div id="proyectos"></div>
    <div id="servicios"></div>
    <div id="contacto"></div>
  </main>

  <script>
    const trigger = document.getElementById("menuTrigger");
    const menu = document.getElementById("mainMenu");
    const close = document.getElementById("menuClose");

    function setMenu(open) {
      menu.classList.toggle("open", open);
      trigger.setAttribute("aria-expanded", String(open));
      trigger.setAttribute(
        "aria-label",
        open ? "Cerrar menú" : "Abrir menú"
      );
    }

    trigger.addEventListener("click", () => {
      setMenu(!menu.classList.contains("open"));
    });

    close.addEventListener("click", () => setMenu(false));

    menu.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => setMenu(false));
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setMenu(false);
    });
  </script>
</body>
</html>
