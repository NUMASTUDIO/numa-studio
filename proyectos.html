<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyectos | NUMA STUDIO</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#ffffff;
  color:#111;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  z-index:100;

  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

header .logo img{
  height:50px;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;

  position:absolute;
  top:45px;
  right:380px;
}

nav > a{
  color:#111;
  font-size:14px;
  text-decoration:none;
  opacity:.8;
  transition:0.3s;
}

nav > a:hover{
  opacity:1;
  color:#ffffff;
}
/* ICONOS */

.hero-social{
  display:flex;
  align-items:center;
  gap:12px;

  position:absolute;
  top:20px;
  right:40px;
  z-index:100;
}

.hero-social a img{
  width:70px;
  height:70px;
  object-fit:contain;
  transition:0.3s;
}

.hero-social a img:hover{
  transform:scale(1.1);
  opacity:0.8;
}
/* FONDO GENERAL */

body{
  font-family:'Inter',sans-serif;
  background:#0d0d0d;
  color:#fff;
  overflow:hidden;
  height:100vh;
}

/* COVER FLOW */

.coverflow-container{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:2200px;
  overflow:hidden;
  position:relative;
}

/* TRACK */

.coverflow{
  position:relative;
  width:100%;
  height:700px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ITEMS */

.project{
  position:absolute;
  width:780px;
  height:440px;
  transition:all .6s ease;
  cursor:pointer;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 30px 60px rgba(0,0,0,0.45);
}

/* IMAGEN */

.project img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CENTRO */

.project.active{
  transform:translateX(0) scale(1);
  z-index:5;
  opacity:1;
}

/* IZQUIERDA */

.project.left{
  transform:
  translateX(-520px)
  rotateY(55deg)
  scale(.78);

  opacity:.45;
  z-index:2;
}

/* DERECHA */

.project.right{
  transform:
  translateX(520px)
  rotateY(-55deg)
  scale(.78);

  opacity:.45;
  z-index:2;
}

/* MÁS LEJOS */

.project.hidden{
  opacity:0;
  pointer-events:none;
}
/* RESPONSIVE */

@media(max-width:768px){

  nav{
    position:static;
    flex-direction:column;
    margin-top:20px;
  }

  header{
    flex-direction:column;
  }

  .hero-social{
    position:static;
    margin-top:20px;
  }

  .contenido{
    padding:220px 20px 60px;
  }

  .contenido h1{
    font-size:34px;
  }

}

</style>
</head>

<body class="fondo-principal">

<header>

  <div class="logo">
   <img src="./images/logo-letras.png" alt="NUMA STUDIO">
  </div>

  <nav>
  <a href="index.html">INICIO</a>
  <a href="index.html#servicios">SERVICIOS</a>
 <a href="index.html#sobre-nosotros">SOBRE NOSOTROS</a>
  <a href="index.html#contacto">CONTACTO</a>
</nav>



<div class="hero-social">

  <a href="https://www.instagram.com/numastudioarq/" target="_blank">
  <img src="./images/instagram-negro.png" alt="Instagram">
</a>

<a href="https://www.facebook.com/numastudioarq/" target="_blank">
  <img src="./images/facebook-negro.png" alt="Facebook">
</a>

<a href="mailto:numastudioarq@outlook.com">
  <img src="./images/correo-negro.png" alt="Correo">
</a>

<a href="https://wa.me/527441298860" target="_blank">
  <img src="./images/icono-whatsapp-negro.png" alt="WhatsApp">
</a>

</div>
</header>
<div class="coverflow-container">

  <div class="coverflow">

    <div class="project left">
      <img src="./images/render1.jpg" alt="">
    </div>

    <div class="project active">
      <img src="./images/cruz-del-sur-depto.jpg" alt="">
    </div>

    <div class="project right">
      <img src="./images/acuario-regional.jpg" alt="">
    </div>

  </div>

</div>
</body>
</html>
