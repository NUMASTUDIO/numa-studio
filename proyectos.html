<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyectos | NUMA STUDIO</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#ffffff;
  color:#111;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  z-index:100;

  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

header .logo img{
  height:50px;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;

  position:absolute;
  top:45px;
  right:380px;
}

nav > a{
  color:#111;
  font-size:14px;
  text-decoration:none;
  opacity:.8;
  transition:0.3s;
}

nav > a:hover{
  opacity:1;
  color:#ffffff;
}
/* ICONOS */

.hero-social{
  display:flex;
  align-items:center;
  gap:12px;

  position:absolute;
  top:20px;
  right:40px;
  z-index:100;
}

.hero-social a img{
  width:70px;
  height:70px;
  object-fit:contain;
  transition:0.3s;
}

.hero-social a img:hover{
  transform:scale(1.1);
  opacity:0.8;
}

/* CONTENIDO */

.contenido{
  padding-top:160px;
  padding-left:135px;
  text-align:left;
}

.contenido h1{
  font-family:'Playfair Display';
  font-size:52px;
  margin-bottom:20px;
}

.contenido p{
  font-size:18px;
  color:#666;
}

/* RESPONSIVE */

@media(max-width:768px){

  nav{
    position:static;
    flex-direction:column;
    margin-top:20px;
  }

  header{
    flex-direction:column;
  }

  .hero-social{
    position:static;
    margin-top:20px;
  }

  .contenido{
    padding:220px 20px 60px;
  }

  .contenido h1{
    font-size:34px;
  }

}
.sobre-nosotros-fondo{
  background-image:url('./images/fondo-tenue.png');
  background-size:100%;
  background-position:center;
  background-repeat:repeat-y;
}
</style>
</head>

<body class="sobre-nosotros-fondo">

<header>

 
</body>
</html>
