<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;

  background:
  radial-gradient(circle at center,
  #1b1b1b 0%,
  #0d0d0d 55%,
  #000000 100%);

  color:#fff;
  overflow:hidden;
  height:100vh;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  z-index:100;

  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

header .logo img{
  height:50px;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;

  position:absolute;
  top:45px;
  right:380px;
}

nav > a{
  color:#ffffff;
  font-size:14px;
  text-decoration:none;
  opacity:.85;
  transition:0.3s;
  letter-spacing:1px;
}

nav > a:hover{
  opacity:1;
  color:#c9a96e;
}

/* ICONOS */

.hero-social{
  display:flex;
  align-items:center;
  gap:12px;

  position:absolute;
  top:20px;
  right:40px;
  z-index:100;
}

.hero-social a img{
  width:70px;
  height:70px;
  object-fit:contain;
  transition:0.3s;
}

.hero-social a img:hover{
  transform:scale(1.1);
  opacity:0.8;
}
/* FONDO GENERAL */

.project.hidden{
  opacity:0;
  pointer-events:none;
}
  .tile.hidden{
  display:none;
}
  /* MOSAIC WALL */

.mosaic-wall{
  width:100%;
  height:100vh;

  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  grid-auto-rows: minmax(160px, 1fr);

  gap:8px;

  padding:90px 8px 8px;

  overflow:hidden;
  align-content:center;
}

/* TILES */

.tile{
  position:relative;
  overflow:hidden;
  background:#111;

  animation:floatTile 12s ease-in-out infinite;
}

/* IMAGEN */

.tile img{
  display:block;

  width:100%;
  height:100%;
  object-fit:cover;

  transition:
  transform 1.2s ease,
  opacity 1s ease;

  opacity:1;
}

/* HOVER */

.tile:hover img{
  transform:scale(1.08);
}

/* MOVIMIENTO SUAVE */

@keyframes floatTile{

  0%{
    transform:
    scale(1)
    translateY(0px);
  }

  25%{
    transform:
    scale(1.02)
    translateY(-4px);
  }

  50%{
    transform:
    scale(1.035)
    translateY(2px);
  }

  75%{
    transform:
    scale(1.02)
    translateY(-3px);
  }

  100%{
    transform:
    scale(1)
    translateY(0px);
  }

}

/* ROTACIÓN DE ALGUNAS */

.tile:nth-child(3n){
  animation-duration:18s;
}

.tile:nth-child(4n){
  animation-duration:14s;
}

.tile:nth-child(5n){
  animation-duration:20s;
}
/* RESPONSIVE */

@media(max-width:768px){

  nav{
    position:static;
    flex-direction:column;
    margin-top:20px;
  }

  header{
    flex-direction:column;
  }

  .hero-social{
    position:static;
    margin-top:20px;
  }

  .contenido{
    padding:220px 20px 60px;
  }

  .contenido h1{
    font-size:34px;
  }

}

  #projectModal{

  inset:0;

  background:rgba(0,0,0,.85);

  justify-content:center;
  align-items:center;

  z-index:9999;
