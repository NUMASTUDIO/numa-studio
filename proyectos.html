<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;

  background:
  radial-gradient(circle at center,
  #1b1b1b 0%,
  #0d0d0d 55%,
  #000000 100%);

  color:#fff;
  overflow:hidden;
  height:100vh;
}

/* HEADER */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  z-index:100;

  background:rgba(0,0,0,0.25);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

header .logo img{
  height:50px;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;

  position:absolute;
  top:45px;
  right:380px;
}

nav > a{
  color:#ffffff;
  font-size:14px;
  text-decoration:none;
  opacity:.85;
  transition:0.3s;
  letter-spacing:1px;
}

nav > a:hover{
  opacity:1;
  color:#c9a96e;
}

/* ICONOS */

.hero-social{
  display:flex;
  align-items:center;
  gap:12px;

  position:absolute;
  top:20px;
  right:40px;
  z-index:100;
}

.hero-social a img{
  width:70px;
  height:70px;
  object-fit:contain;
  transition:0.3s;
}

.hero-social a img:hover{
  transform:scale(1.1);
  opacity:0.8;
}
/* FONDO GENERAL */

.project.hidden{
  opacity:0;
  pointer-events:none;
}
  /* MOSAIC WALL */

.mosaic-wall{
  width:100%;
  height:100vh;

  display:flex;
  gap:20px;

  padding:120px 40px;

  overflow:hidden;
  white-space:nowrap;

  position:relative;
}
  .mosaic-wall{
  animation:flow 40s linear infinite;
}

@keyframes flow{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-50%); }
}
/* TILES */

.tile{
  flex:0 0 auto;

  width:240px;
  height:240px;

  border-radius:14px;
  overflow:hidden;

  box-shadow:0 10px 30px rgba(0,0,0,0.4);

  transition:transform 0.4s ease, filter 0.4s ease;
}
  .tile:hover{
  transform:scale(1.15);
  z-index:10;
  filter:brightness(1.1);
}

/* IMAGEN */

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:
  transform 1.2s ease,
  opacity 1s ease;
}

/* HOVER */

.tile:hover img{
  transform:scale(1.08);
}

/* MOVIMIENTO SUAVE */

@keyframes floatTile{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.03);
  }

  100%{
    transform:scale(1);
  }

}

/* ROTACIÓN DE ALGUNAS */

.tile:nth-child(3n){
  animation-duration:18s;
}

.tile:nth-child(4n){
  animation-duration:14s;
}

.tile:nth-child(5n){
  animation-duration:20s;
}
/* RESPONSIVE */

@media(max-width:768px){

  nav{
    position:static;
    flex-direction:column;
    margin-top:20px;
  }

  header{
    flex-direction:column;
  }

  .hero-social{
    position:static;
    margin-top:20px;
  }

  .contenido{
    padding:220px 20px 60px;
  }

  .contenido h1{
    font-size:34px;
  }

}
